# Dev gateway: everything is served on http://localhost/ so the frontend, /api and /ws share
# one origin. The API (8000) and Vite (5173) run on the host. Card art is served directly from
# the Cloudflare R2 public URL, not through nginx.
#
# proxy_set_header in a location replaces (not extends) inherited headers, so each location
# sets the full list.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Game sockets stay open for a whole match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite dev server, with WebSocket upgrade for hot reload.
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
