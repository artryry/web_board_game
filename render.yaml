# Render Blueprint (https://render.com/docs/blueprint-spec).
# One web service: the Docker image runs the API and serves the built frontend, so the app and
# /api share an origin, as the refresh cookie needs. Postgres is Neon, Redis is Upstash and card
# art is Cloudflare R2; their URLs and keys are entered in the Render dashboard, never here.
services:
  - type: web
    name: card-table
    runtime: docker
    # Free sleeps after 15 min without traffic. For an always-on app switch to `starter`, and move
    # `alembic upgrade head` from backend/scripts/start.sh to a preDeployCommand.
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy a commit only after its GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    # Touches no service, so the frequent probes cost no Redis commands or database wake-ups.
    healthCheckPath: /api/health/live
    envVars:
      # sync: false means Render asks for the value when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # One JSON object per line in Render's log viewer (context/deployment.md, Reading the logs).
      - key: LOG_FORMAT
        value: json
